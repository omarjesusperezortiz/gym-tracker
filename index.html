<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Omar's Upper-Body Tracker</title>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--card2:#232a4a;--acc:#6c8cff;--acc2:#4dd6a1;--warn:#ffb84d;--txt:#eef1ff;--mut:#9aa3c7;--line:#2c3358;--red:#ff6b6b;--blue:#5ab0ff;--green:#4dd6a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:80px}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#141834,#0f1220);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0;font-size:18px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:12px}
.tab{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;transition:.15s}
.tab.active{background:var(--acc);border-color:var(--acc);color:#0f1220}
.tab small{display:block;font-weight:500;font-size:10px;opacity:.8;margin-top:2px}
.wrap{padding:14px 12px}
.banner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--mut);line-height:1.5}
.banner b{color:var(--txt)}
.slot{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.slot.done{border-color:var(--acc2)}
.shead{padding:12px 14px;display:flex;align-items:center;gap:10px}
.snum{width:26px;height:26px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--acc);flex:none}
.sinfo{flex:1;min-width:0}
.sname{font-weight:700;font-size:15px}
.sscheme{font-size:12px;color:var(--mut);margin-top:2px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#0f1220;background:transparent;transition:.15s}
.chk.on{background:var(--acc2);border-color:var(--acc2)}
.varbar{display:flex;gap:6px;padding:0 14px 10px}
.vbtn{flex:1;padding:8px 4px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;text-align:center}
.vbtn.active{background:var(--acc);color:#0f1220;border-color:var(--acc)}
.vdetail{padding:0 14px 14px}
.exname{font-weight:700;font-size:14px;margin-bottom:6px}
.exname .tag{font-size:10px;background:var(--card2);color:var(--mut);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
.cue{font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:10px}
.imgs{display:flex;gap:8px;margin-bottom:12px}
.imgs img{width:50%;border-radius:10px;background:#fff;aspect-ratio:5/4;object-fit:cover}
.force{display:flex;align-items:center;gap:8px;background:rgba(255,184,77,.09);border:1px solid rgba(255,184,77,.3);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:12px}
.force.hide{display:none}
.force b{color:var(--warn)}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;align-items:center;gap:8px}
.setrow .lbl{width:44px;font-size:12px;color:var(--mut);font-weight:600}
.setrow input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:15px;text-align:center;font-weight:600}
.setrow input:focus{outline:none;border-color:var(--acc)}
.setrow .x{color:var(--mut);font-size:13px}
.setrow .last{width:70px;font-size:11px;color:var(--acc2);text-align:right;flex:none}
.addset{margin-top:8px;background:transparent;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:8px;width:100%;font-size:12px;cursor:pointer}
.finish{position:fixed;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(0deg,#0f1220,rgba(15,18,32,.7));display:flex;gap:10px;z-index:40}
.finish button{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer}
.bfin{background:var(--acc2);color:#0f1220}
.bhist{background:var(--card2);color:var(--txt);flex:0 0 52px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end}
.modal.show{display:flex}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow:auto;padding:18px 16px 30px;border-top:1px solid var(--line)}
.sheet h2{margin:0 0 4px;font-size:17px}
.hentry{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
.hentry .hd{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-bottom:6px}
.hentry .hln{color:var(--txt);line-height:1.6}
.closeb{width:100%;margin-top:16px;padding:12px;border-radius:12px;background:var(--acc);border:none;color:#0f1220;font-weight:700;font-size:15px}
.empty{color:var(--mut);text-align:center;padding:30px 10px;font-size:13px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--acc2);color:#0f1220;padding:10px 18px;border-radius:20px;font-weight:700;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.tip{font-size:11px;color:var(--mut);text-align:center;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>🏋️ Upper-Body Tracker</h1>
  <div class="sub">Grow the upper body · skate stays flexible · A → B → C</div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="wrap" id="wrap"></div>
<div class="finish">
  <button class="bhist" onclick="showHistory()">📊</button>
  <button class="bfin" onclick="finishWorkout()">✅ Finish & Save Session</button>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const DATA = {"sessions": {"A": {"name": "PUSH", "emoji": "🔴", "muscles": "chest · shoulders · triceps", "slots": [["Chest press", "4 × 6–8", "5 × 3–5 heavy, 3 min rest"], ["Overhead press (shoulders)", "3 × 8–10", "4 × 4–6 heavier"], ["Incline / upper chest", "3 × 10–12", ""], ["Side delts (lateral)", "3 × 12–15", ""], ["Triceps", "3 × 10–12", ""], ["Ab flexion (lower/upper)", "3 × 10–15", ""], ["Anti-extension core", "2 × 40–60s", ""]]}, "B": {"name": "PULL", "emoji": "🔵", "muscles": "back · rear delts · biceps", "slots": [["Vertical pull (lats)", "4 × 6–10", "weighted 5 × 3–5"], ["Horizontal row (back)", "4 × 8–10", "4 × 5 heavy"], ["Rear delts", "3 × 15", ""], ["Biceps", "3 × 10–12", ""], ["Anti-rotation core", "3 × 10/side", ""], ["Ab flexion (lower/upper)", "2 × 15", ""]]}, "C": {"name": "FULL UPPER", "emoji": "🟢", "muscles": "balanced + extra arms", "slots": [["Chest press", "4 × 10–15", ""], ["Horizontal row (back)", "4 × 10–12", ""], ["Overhead press (shoulders)", "3 × 10–12", ""], ["Side delts (lateral)", "3 × 15", ""], ["Biceps", "3 × 10–12", ""], ["Triceps", "3 × 10–12", ""], ["Anti-extension core", "3 × 20–30s", ""]]}}, "variations": {"Chest press": {"gym": {"name": "Barbell Bench Press - Medium Grip", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Bench_Press_-_Medium_Grip/1.jpg"}, "db": {"name": "Dumbbell Bench Press", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bench_Press/1.jpg"}, "bw": {"name": "Pushups", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pushups/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pushups/1.jpg"}}, "Overhead press (shoulders)": {"gym": {"name": "Barbell Shoulder Press", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Shoulder_Press/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Barbell_Shoulder_Press/1.jpg"}, "db": {"name": "Standing Dumbbell Press", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Dumbbell_Press/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Standing_Dumbbell_Press/1.jpg"}, "bw": {"name": "Decline Push-Up", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/1.jpg"}}, "Incline / upper chest": {"gym": {"name": "Incline Cable Flye", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Cable_Flye/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Cable_Flye/1.jpg"}, "db": {"name": "Incline Dumbbell Press", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Press/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Incline_Dumbbell_Press/1.jpg"}, "bw": {"name": "Decline Push-Up", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Decline_Push-Up/1.jpg"}}, "Side delts (lateral)": {"gym": {"name": "Side Lateral Raise", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/1.jpg"}, "db": {"name": "Side Lateral Raise", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Side_Lateral_Raise/1.jpg"}, "bw": {"name": "Lateral Raise - With Bands", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Lateral_Raise_-_With_Bands/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Lateral_Raise_-_With_Bands/1.jpg"}}, "Triceps": {"gym": {"name": "Triceps Pushdown", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Triceps_Pushdown/1.jpg"}, "db": {"name": "Tricep Dumbbell Kickback", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Tricep_Dumbbell_Kickback/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Tricep_Dumbbell_Kickback/1.jpg"}, "bw": {"name": "Bench Dips", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Dips/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bench_Dips/1.jpg"}}, "Vertical pull (lats)": {"gym": {"name": "Wide-Grip Lat Pulldown", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Wide-Grip_Lat_Pulldown/1.jpg"}, "db": {"name": "One-Arm Dumbbell Row", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/1.jpg"}, "bw": {"name": "Pullups", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pullups/1.jpg"}}, "Horizontal row (back)": {"gym": {"name": "Bent Over Barbell Row", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Bent_Over_Barbell_Row/1.jpg"}, "db": {"name": "One-Arm Dumbbell Row", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/One-Arm_Dumbbell_Row/1.jpg"}, "bw": {"name": "Inverted Row", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Inverted_Row/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Inverted_Row/1.jpg"}}, "Rear delts": {"gym": {"name": "Face Pull", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Face_Pull/1.jpg"}, "db": {"name": "Seated Bent-Over Rear Delt Raise", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Bent-Over_Rear_Delt_Raise/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Seated_Bent-Over_Rear_Delt_Raise/1.jpg"}, "bw": {"name": "Band Pull Apart", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Pull_Apart/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Band_Pull_Apart/1.jpg"}}, "Biceps": {"gym": {"name": "Cable Hammer Curls - Rope Attachment", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Hammer_Curls_-_Rope_Attachment/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Cable_Hammer_Curls_-_Rope_Attachment/1.jpg"}, "db": {"name": "Dumbbell Bicep Curl", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bicep_Curl/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Bicep_Curl/1.jpg"}, "bw": {"name": "Chin-Up", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chin-Up/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Chin-Up/1.jpg"}}, "Anti-rotation core": {"gym": {"name": "Pallof Press", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pallof_Press/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Pallof_Press/1.jpg"}, "db": {"name": "Dumbbell Side Bend", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Side_Bend/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Dumbbell_Side_Bend/1.jpg"}, "bw": {"name": "Plank", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"}}, "Ab flexion (lower/upper)": {"gym": {"name": "Hanging Leg Raise", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Hanging_Leg_Raise/1.jpg"}, "db": {"name": "Weighted Crunches", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Weighted_Crunches/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Weighted_Crunches/1.jpg"}, "bw": {"name": "Air Bike", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Air_Bike/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Air_Bike/1.jpg"}}, "Anti-extension core": {"gym": {"name": "Ab Roller", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Ab_Roller/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Ab_Roller/1.jpg"}, "db": {"name": "Plank", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"}, "bw": {"name": "Plank", "img": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/0.jpg", "img2": "https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Plank/1.jpg"}}}, "cues": {"Barbell Bench Press - Medium Grip": "Bar to mid-chest, elbows ~45°, press up.", "Dumbbell Bench Press": "DBs at chest, press up and slightly together.", "Pushups": "Body straight, chest to floor, press up. Feet up = harder.", "Barbell Shoulder Press": "Press bar overhead from shoulders, brace core.", "Standing Dumbbell Press": "Press DBs overhead, don't over-flare elbows.", "Decline Push-Up": "Feet elevated push-up — hits shoulders/upper chest.", "Incline Cable Flye": "Low-to-high cable flye for upper chest.", "Incline Dumbbell Press": "Bench ~30°, press DBs up and together.", "Side Lateral Raise": "Raise out to sides to shoulder height, slight elbow bend. Light.", "Lateral Raise - With Bands": "Bands: raise arms out to sides, control down.", "Triceps Pushdown": "Elbows pinned, extend down, squeeze.", "Tricep Dumbbell Kickback": "Hinge, extend DB back, squeeze triceps.", "Bench Dips": "Hands on bench behind you, lower & press up.", "Wide-Grip Lat Pulldown": "Pull bar to upper chest, drive elbows down.", "One-Arm Dumbbell Row": "Hand on bench, row DB to hip, squeeze back.", "Pullups": "Pull chin over bar. Band-assist if needed.", "Bent Over Barbell Row": "Hinge, row bar to lower ribs, squeeze blades.", "Inverted Row": "Under a bar/table, pull chest up, body straight.", "Face Pull": "Rope/band to face, elbows high — great for skater shoulders.", "Seated Bent-Over Rear Delt Raise": "Hinge seated, raise DBs out, squeeze rear delts.", "Band Pull Apart": "Band at chest, pull apart, squeeze shoulder blades.", "Cable Hammer Curls - Rope Attachment": "Rope curl, neutral grip, control.", "Dumbbell Bicep Curl": "Curl with control, no swing, squeeze top.", "Chin-Up": "Underhand grip pull-up — big biceps + back.", "Pallof Press": "Band from side, press straight out, resist the twist.", "Dumbbell Side Bend": "DB one side, bend & return — obliques.", "Plank": "Forearms down, body straight, brace, hold.", "Hanging Leg Raise": "Hang, raise legs with control, no swing.", "Weighted Crunches": "Crunch holding weight on chest, control.", "Air Bike": "Alternate elbow to opposite knee, controlled.", "Ab Roller": "Roll out & back keeping core braced.", "Dead Bug": "On back, opposite arm+leg extend slowly, back flat."}};
const KINDS=[["gym","🏋️ Gym"],["db","🏠 DBs"],["bw","🚫 No-kit"]];
const LS_LOG="obt_log_v1", LS_PREF="obt_pref_v1";
let cur="A";
let pref=JSON.parse(localStorage.getItem(LS_PREF)||"{}"); // {slot:kind}
let live={}; // in-progress sets this session: key `${sess}|${slot}` -> {kind,done,sets:[{w,r}]}

function log(){return JSON.parse(localStorage.getItem(LS_LOG)||"[]");}
function saveLog(a){localStorage.setItem(LS_LOG,JSON.stringify(a));}
function savePref(){localStorage.setItem(LS_PREF,JSON.stringify(pref));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

function lastFor(sess,slot,kind){
  const l=log();
  for(let i=l.length-1;i>=0;i--){
    if(l[i].sess!==sess) continue;
    const s=l[i].slots.find(x=>x.slot===slot);
    if(s && s.kind===kind && s.sets && s.sets.length) return s.sets;
  }
  return null;
}
function parseTarget(scheme){ // "4 × 6–8" -> {sets:4}
  const m=scheme.match(/(\d+)\s*×/); return m?parseInt(m[1]):3;
}
function keyOf(slot){return cur+"|"+slot;}

function renderTabs(){
  const t=document.getElementById('tabs'); t.innerHTML="";
  for(const k of ["A","B","C"]){
    const s=DATA.sessions[k];
    const d=document.createElement('div');
    d.className="tab"+(k===cur?" active":"");
    d.innerHTML=`${s.emoji} ${k}<small>${s.name}</small>`;
    d.onclick=()=>{cur=k;render();};
    t.appendChild(d);
  }
}

function render(){
  renderTabs();
  const s=DATA.sessions[cur];
  const w=document.getElementById('wrap'); w.innerHTML="";
  const b=document.createElement('div'); b.className="banner";
  b.innerHTML=`<b>${s.emoji} Session ${cur} — ${s.name}</b> · ${s.muscles}<br>Pick 🏋️/🏠/🚫 per exercise, log your sets, tap ⬤ when done. Last week's numbers show in green so you know what to beat.`;
  w.appendChild(b);

  s.slots.forEach((sl,i)=>{
    const [slot,scheme,force]=sl;
    const k=keyOf(slot);
    if(!live[k]) live[k]={kind:pref[slot]||"gym",done:false,sets:null};
    const st=live[k];
    const kind=st.kind;
    const vr=DATA.variations[slot][kind];
    const cue=vr?(DATA.cues[vr.name]||""):"";
    const nTarget=parseTarget(scheme);
    if(!st.sets){ // init sets from target
      const lp=lastFor(cur,slot,kind);
      st.sets=Array.from({length:nTarget},(_,j)=>({w:"",r:"",last:lp&&lp[j]?`${lp[j].w||"–"}×${lp[j].r||"–"}`:""}));
    }
    const card=document.createElement('div'); card.className="slot"+(st.done?" done":"");
    // head
    let h=`<div class="shead"><div class="snum">${i+1}</div><div class="sinfo"><div class="sname">${slot}</div><div class="sscheme">${scheme}${force?' · 💪 force option':''}</div></div>
      <div class="chk ${st.done?'on':''}" data-k="${k}">${st.done?'✓':''}</div></div>`;
    // var bar
    h+=`<div class="varbar">`+KINDS.map(([kk,lbl])=>`<div class="vbtn ${kk===kind?'active':''}" data-vk="${k}" data-kind="${kk}">${lbl}</div>`).join('')+`</div>`;
    // detail
    h+=`<div class="vdetail">`;
    if(vr){
      h+=`<div class="exname">${vr.name}<span class="tag">${KINDS.find(x=>x[0]===kind)[1]}</span></div>`;
      if(cue)h+=`<div class="cue">${cue}</div>`;
      h+=`<div class="imgs"><img loading="lazy" src="${vr.img}"><img loading="lazy" src="${vr.img2}"></div>`;
    }
    if(force) h+=`<div class="force" id="force-${btoa(unescape(encodeURIComponent(slot))).replace(/=/g,'')}"><b>💪 Force:</b> ${force} <span style="color:var(--mut)">— tap for strength focus</span></div>`;
    h+=`<div class="sets">`;
    st.sets.forEach((set,j)=>{
      h+=`<div class="setrow"><div class="lbl">Set ${j+1}</div>
        <input inputmode="decimal" placeholder="kg" value="${set.w}" data-sk="${k}" data-si="${j}" data-f="w">
        <span class="x">×</span>
        <input inputmode="numeric" placeholder="reps" value="${set.r}" data-sk="${k}" data-si="${j}" data-f="r">
        <div class="last">${set.last?('last '+set.last):''}</div></div>`;
    });
    h+=`</div><button class="addset" data-add="${k}">+ add set</button></div>`;
    card.innerHTML=h;
    w.appendChild(card);
  });

  // wire events
  w.querySelectorAll('.chk').forEach(e=>e.onclick=()=>{const k=e.dataset.k;live[k].done=!live[k].done;render();});
  w.querySelectorAll('.vbtn').forEach(e=>e.onclick=()=>{
    const k=e.dataset.vk, kind=e.dataset.kind, slot=k.split("|")[1];
    live[k].kind=kind; live[k].sets=null; pref[slot]=kind; savePref(); render();
  });
  w.querySelectorAll('input').forEach(e=>e.oninput=()=>{
    const k=e.dataset.sk,i=+e.dataset.si,f=e.dataset.f; live[k].sets[i][f]=e.value;
  });
  w.querySelectorAll('.addset').forEach(e=>e.onclick=()=>{const k=e.dataset.add;live[k].sets.push({w:"",r:"",last:""});render();});
}

function finishWorkout(){
  const s=DATA.sessions[cur];
  const slots=[];
  s.slots.forEach(sl=>{
    const slot=sl[0], k=keyOf(slot), st=live[k];
    if(!st) return;
    const sets=(st.sets||[]).filter(x=>x.w!==""||x.r!=="").map(x=>({w:x.w,r:x.r}));
    if(sets.length||st.done) slots.push({slot,kind:st.kind,done:st.done,sets});
  });
  if(!slots.length){toast("Log something first 💪");return;}
  const l=log();
  l.push({date:new Date().toISOString(),sess:cur,name:s.name,slots});
  saveLog(l);
  // clear live for this session
  s.slots.forEach(sl=>{delete live[keyOf(sl[0])];});
  toast("Session "+cur+" saved! 🎉");
  render();
}

function showHistory(){
  const l=log().slice().reverse();
  const sh=document.getElementById('sheet');
  let h=`<h2>📊 Workout History</h2><div class="sub" style="color:var(--mut);font-size:12px">${l.length} sessions logged</div>`;
  if(!l.length) h+=`<div class="empty">No sessions yet.<br>Log your first workout and it'll show here — with numbers to beat next time.</div>`;
  l.slice(0,40).forEach(e=>{
    const d=new Date(e.date);
    const ds=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+" · "+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    h+=`<div class="hentry"><div class="hd"><span>${DATA.sessions[e.sess].emoji} Session ${e.sess} — ${e.name}</span><span>${ds}</span></div><div class="hln">`;
    h+=e.slots.map(s=>{
      const sets=(s.sets||[]).map(x=>`${x.w||'–'}×${x.r||'–'}`).join(', ');
      return `<b>${s.slot}</b> <span style="color:var(--mut)">(${s.kind})</span>: ${sets||'✓'}`;
    }).join('<br>');
    h+=`</div></div>`;
  });
  h+=`<button class="closeb" onclick="hideModal()">Close</button>`;
  if(l.length)h+=`<div class="tip">Tip: export/backup your data — it lives only on this device.</div><button class="addset" style="margin-top:10px" onclick="exportData()">⬇︎ Export my data (JSON)</button>`;
  sh.innerHTML=h;
  document.getElementById('modal').classList.add('show');
}
function hideModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').onclick=(e)=>{if(e.target.id==='modal')hideModal();};
function exportData(){
  const blob=new Blob([JSON.stringify({log:log(),pref},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='upperbody-tracker-backup.json';a.click();
}
render();
</script>
</body>
</html>
