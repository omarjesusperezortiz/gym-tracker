<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Gym · Upper-Body Tracker</title>
<style>
:root{
  /* Surfaces (Linear luminance-stack, warmed slightly for fitness) */
  --bg:#0a0b0e; --panel:#101216; --surf:#161920; --surf2:#1d212a; --surf3:#252a35;
  /* Ink */
  --ink:#f5f7fa; --ink2:#c3c9d4; --mut:#868e9e; --mut2:#5b6373;
  /* Accent: energetic lime-green (fitness energy, high contrast on dark) */
  --acc:#c6f24e; --acc-d:#a6d92e; --acc-ink:#0a0b0e;
  --blue:#5aa9ff; --violet:#9b8cff;
  /* Session hues */
  --push:#ff6b5e; --pull:#5aa9ff; --full:#c6f24e;
  --ok:#3ddc97; --warn:#ffb84d; --danger:#ff5f6b;
  /* Lines */
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.11);
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  font-feature-settings:"cv01","ss03";-webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
.safe-top{padding-top:env(safe-area-inset-top)}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(10,11,14,.82);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.hbar{padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc-d));
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 14px rgba(198,242,78,.28)}
.logo svg{width:20px;height:20px}
.htitle{font-weight:600;font-size:16px;letter-spacing:-.3px;line-height:1.1}
.hsub{font-size:11px;color:var(--mut);letter-spacing:.2px;margin-top:1px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.15s}
.iconbtn:active{transform:scale(.92);background:rgba(255,255,255,.09)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--warn);transform:translate(11px,-11px);border:2px solid var(--bg)}

/* Tabs */
.tabs{display:flex;gap:8px;padding:14px 18px 12px}
.tab{flex:1;position:relative;padding:12px 6px;border-radius:14px;background:var(--surf);border:1px solid var(--line);
  cursor:pointer;transition:.18s cubic-bezier(.2,.7,.3,1);text-align:left;overflow:hidden}
.tab .tk{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}
.tab .tn{font-size:15px;font-weight:600;letter-spacing:-.2px;margin-top:3px;color:var(--ink2)}
.tab .tv{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;opacity:.9}
.tab[data-k="A"] .tv{background:var(--push)} .tab[data-k="B"] .tv{background:var(--pull)} .tab[data-k="C"] .tv{background:var(--full)}
.tab.active{background:var(--surf2);border-color:var(--line2);transform:translateY(-1px)}
.tab.active .tn{color:var(--ink)}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px}
.tab.active[data-k="A"]::after{background:var(--push)} .tab.active[data-k="B"]::after{background:var(--pull)} .tab.active[data-k="C"]::after{background:var(--full)}

/* Progress strip */
.prog{margin:0 18px 14px;display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:none;
  background:conic-gradient(var(--acc) calc(var(--p)*1%), rgba(255,255,255,.08) 0);
  display:flex;align-items:center;justify-content:center;position:relative}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surf)}
.ring b{position:relative;font-size:12px;font-weight:700;color:var(--ink)}
.prog .pt{flex:1;min-width:0}
.prog .pt .pl{font-size:13px;font-weight:600;letter-spacing:-.2px}
.prog .pt .ps{font-size:12px;color:var(--mut);margin-top:2px}

.wrap{padding:0 14px}

/* Exercise card */
.ex{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:14px;overflow:hidden;
  transition:border-color .2s, transform .1s}
.ex.done{border-color:rgba(61,220,151,.4)}
.ex.done .head{background:linear-gradient(90deg,rgba(61,220,151,.08),transparent)}
.head{padding:15px 16px 13px;display:flex;align-items:flex-start;gap:12px}
.num{width:28px;height:28px;border-radius:9px;background:var(--surf2);border:1px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mut)}
.ex.done .num{background:var(--ok);border-color:var(--ok);color:#062a1c}
.hmeta{flex:1;min-width:0}
.hname{font-size:16px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.hscheme{font-size:12px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scheme-pill{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--surf2);border:1px solid var(--line);
  padding:2px 7px;border-radius:6px}
.forcebtn{font-size:11px;font-weight:600;color:var(--warn);background:rgba(255,184,77,.1);border:1px solid rgba(255,184,77,.28);
  padding:2px 8px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.forcebtn.on{background:var(--warn);color:#3a2600;border-color:var(--warn)}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:transparent}
.check svg{width:16px;height:16px;stroke:var(--acc-ink);opacity:0}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{opacity:1;stroke:#062a1c}
.check:active{transform:scale(.9)}

/* Variation segmented control */
.seg{display:flex;gap:0;margin:0 16px 12px;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:3px;position:relative}
.seg .segi{flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer;
  border-radius:8px;transition:color .2s;position:relative;z-index:2}
.seg .segi.active{color:var(--acc-ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;width:calc((100% - 6px)/3);background:var(--acc);border-radius:8px;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:1;box-shadow:0 2px 8px rgba(198,242,78,.3)}

/* Detail */
.detail{padding:0 16px 16px}
.exhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.exvarname{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
.cue{font-size:12.5px;color:var(--mut);line-height:1.55;margin-bottom:12px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.imgcell{position:relative;border-radius:12px;overflow:hidden;background:#fff;aspect-ratio:5/4;border:1px solid var(--line)}
.imgcell img{width:100%;height:100%;object-fit:cover;display:block}
.imgcell .tag{position:absolute;left:7px;top:7px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  background:rgba(10,11,14,.72);color:#fff;padding:2px 7px;border-radius:5px;backdrop-filter:blur(4px)}

.force-note{display:none;align-items:center;gap:8px;background:rgba(255,184,77,.08);border:1px solid rgba(255,184,77,.25);
  border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--ink2)}
.force-note.show{display:flex}
.force-note b{color:var(--warn)}

/* Sets */
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:52px 1fr auto 1fr 66px;align-items:center;gap:8px}
.setrow .sl{font-size:11px;color:var(--mut);font-weight:600;font-family:var(--mono)}
.setrow input{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  padding:11px 8px;font-size:16px;text-align:center;font-weight:600;font-family:var(--mono);transition:.15s;min-width:0}
.setrow input::placeholder{color:var(--mut2);font-weight:400}
.setrow input:focus{outline:none;border-color:var(--acc);background:var(--surf3);box-shadow:0 0 0 3px rgba(198,242,78,.12)}
.setrow input.filled{border-color:rgba(198,242,78,.35)}
.setrow .x{color:var(--mut2);font-size:13px;text-align:center}
.setrow .last{font-size:11px;color:var(--ok);text-align:right;font-family:var(--mono);opacity:.85}
.addset{margin-top:10px;width:100%;background:transparent;border:1px dashed var(--line2);color:var(--mut);
  border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.addset:active{background:rgba(255,255,255,.04)}

/* Bottom action bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,var(--bg) 55%,rgba(10,11,14,0));display:flex;gap:10px}
.dock .primary{flex:1;padding:16px;border-radius:16px;border:none;font-weight:700;font-size:15px;letter-spacing:-.2px;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc-d));color:var(--acc-ink);box-shadow:0 6px 20px rgba(198,242,78,.32);
  display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s}
.dock .primary:active{transform:translateY(2px) scale(.99)}
.dock .primary svg{width:19px;height:19px}
.dock .ghost{flex:0 0 56px;border-radius:16px;background:var(--surf);border:1px solid var(--line);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.dock .ghost svg{width:20px;height:20px}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end}
.modal.show{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);border-radius:22px 22px 0 0;width:100%;max-height:86vh;overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(30px)}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--surf3);margin:0 auto 16px}
.sheet h2{margin:0 0 3px;font-size:18px;letter-spacing:-.4px}
.sheet .sh-sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.hentry{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.hentry .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hentry .hbadge{font-size:12px;font-weight:600}
.hentry .htime{color:var(--mut);font-size:11px;font-family:var(--mono)}
.hentry .hln{color:var(--ink2);font-size:12.5px;line-height:1.7}
.hentry .hln b{color:var(--ink)}
.empty{color:var(--mut);text-align:center;padding:36px 14px;font-size:13px;line-height:1.6}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}

/* Settings rows */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  padding:12px;font-size:14px;font-family:var(--mono)}
.field input:focus{outline:none;border-color:var(--acc)}
.field .hint{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.5}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px}
.btn.acc{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--surf2);color:var(--ink);border:1px solid var(--line)}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);padding:10px 12px;background:var(--surf);
  border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.sync-status .sd{width:8px;height:8px;border-radius:50%;flex:none}
.sd.ok{background:var(--ok)} .sd.off{background:var(--mut2)} .sd.err{background:var(--danger)} .sd.sync{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Toast */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);
  background:var(--surf3);color:var(--ink);border:1px solid var(--line2);padding:11px 18px;border-radius:14px;font-weight:600;
  font-size:13px;z-index:200;opacity:0;transition:.3s;box-shadow:var(--sh);pointer-events:none;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ti{width:16px;height:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M2 6l4-4M18 22l4-4M3 3l1 1M20 20l1 1M3.5 9.5l6-6M14.5 20.5l6-6"/></svg></div>
      <div><div class="htitle">Upper-Body</div><div class="hsub">Grow strong · skate flexible</div></div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="iconbtn" onclick="showHistory()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 106 5.3L3 8"/><path d="M12 7v5l3 3"/></svg></div>
      <div class="iconbtn" style="position:relative" onclick="showSettings()"><span class="dot" id="hdr-sync" style="display:none"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="wrap" id="wrap"></div>
<div class="dock">
  <div class="ghost" onclick="showHistory()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 106 5.3L3 8"/><path d="M12 7v5l3 3"/></svg></div>
  <button class="primary" onclick="finishWorkout()"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Finish &amp; Save</button>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

ise DBs out, squeeze rear delts.", "Band Pull Apart": "Band at chest, pull apart, squeeze shoulder blades.", "Cable Hammer Curls - Rope Attachment": "Rope curl, neutral grip, control.", "Dumbbell Bicep Curl": "Curl with control, no swing, squeeze top.", "Chin-Up": "Underhand grip pull-up — big biceps + back.", "Pallof Press": "Band from side, press straight out, resist the twist.", "Dumbbell Side Bend": "DB one side, bend & return — obliques.", "Plank": "Forearms down, body straight, brace, hold.", "Hanging Leg Raise": "Hang, raise legs with control, no swing.", "Weighted Crunches": "Crunch holding weight on chest, control.", "Air Bike": "Alternate elbow to opposite knee, controlled.", "Ab Roller": "Roll out & back keeping core braced.", "Dead Bug": "On back, opposite arm+leg extend slowly, back flat."}};
const KINDS=[["gym","Gym"],["db","Dumbbells"],["bw","No-kit"]];
const LS_LOG="obt_log_v2", LS_PREF="obt_pref_v2", LS_GH="obt_gh_v1";
let cur="A", live={};
let pref=JSON.parse(localStorage.getItem(LS_PREF)||"{}");
let gh=JSON.parse(localStorage.getItem(LS_GH)||"null"); // {token,repo}
let syncState="off"; // off|ok|sync|err

const $=s=>document.querySelector(s);
const ico={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
 save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
 hist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 106 5.3L3 8"/><path d="M12 7v5l3 3"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
 dumb:'<svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11"/><path d="M21 21l-1-1"/><path d="M3 3l1 1"/><path d="M18 22l4-4"/><path d="M2 6l4-4"/><path d="M3 10l7-7"/><path d="M14 21l7-7"/></svg>',
 empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5l11 11M2 6l4-4M18 22l4-4"/></svg>'
};

function log(){return JSON.parse(localStorage.getItem(LS_LOG)||"[]");}
function saveLog(a){localStorage.setItem(LS_LOG,JSON.stringify(a));}
function savePref(){localStorage.setItem(LS_PREF,JSON.stringify(pref));}
function toast(m,icon){const t=$("#toast");t.innerHTML=(icon||"")+"<span>"+m+"</span>";t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function parseTarget(s){const m=s.match(/(\d+)\s*×/);return m?parseInt(m[1]):3;}
function keyOf(slot){return cur+"|"+slot;}

function lastFor(sess,slot,kind){
  const l=log();
  for(let i=l.length-1;i>=0;i--){
    if(l[i].sess!==sess)continue;
    const s=(l[i].slots||[]).find(x=>x.slot===slot);
    if(s&&s.kind===kind&&s.sets&&s.sets.length)return s.sets;
  }
  return null;
}

function renderTabs(){
  const t=$("#tabs");t.innerHTML="";
  for(const k of ["A","B","C"]){
    const s=DATA.sessions[k];
    const d=document.createElement('div');
    d.className="tab"+(k===cur?" active":"");d.dataset.k=k;
    d.innerHTML=`<div class="tv"></div><div class="tk">Session ${k}</div><div class="tn">${s.name}</div>`;
    d.onclick=()=>{cur=k;render();};
    t.appendChild(d);
  }
}

function progress(){
  const s=DATA.sessions[cur];let done=0;
  s.slots.forEach(sl=>{const st=live[keyOf(sl[0])];if(st&&st.done)done++;});
  return {done,total:s.slots.length,pct:Math.round(done/s.slots.length*100)};
}

function render(){
  renderTabs();
  const s=DATA.sessions[cur];
  const p=progress();
  const w=$("#wrap");
  // progress strip
  let html=`<div class="prog"><div class="ring" style="--p:${p.pct}"><b>${p.pct}%</b></div>
    <div class="pt"><div class="pl">${p.done} of ${p.total} exercises done</div>
    <div class="ps">${s.emoji} Session ${cur} · ${s.muscles}</div></div></div>`;
  w.innerHTML=html;

  s.slots.forEach((sl,i)=>{
    const [slot,scheme,force]=sl, k=keyOf(slot);
    if(!live[k])live[k]={kind:pref[slot]||"gym",done:false,sets:null,force:false};
    const st=live[k], kind=st.kind;
    const vr=DATA.variations[slot][kind];
    const cue=vr?(DATA.cues[vr.name]||""):"";
    if(!st.sets){
      const lp=lastFor(cur,slot,kind), n=parseTarget(scheme);
      st.sets=Array.from({length:n},(_,j)=>({w:"",r:"",last:lp&&lp[j]?`${lp[j].w||"–"}×${lp[j].r||"–"}`:""}));
    }
    const kIdx=KINDS.findIndex(x=>x[0]===kind);
    const card=document.createElement('div');card.className="ex"+(st.done?" done":"");
    let h=`<div class="head"><div class="num">${st.done?ico.check:(i+1)}</div>
      <div class="hmeta"><div class="hname">${slot}</div>
      <div class="hscheme"><span class="scheme-pill">${st.force&&force?force:scheme}</span>
      ${force?`<span class="forcebtn ${st.force?'on':''}" data-force="${k}">💪 Force</span>`:''}</div></div>
      <div class="check ${st.done?'on':''}" data-chk="${k}">${ico.check}</div></div>`;
    // segmented
    h+=`<div class="seg"><div class="thumb" style="transform:translateX(${kIdx*100}%)"></div>`+
      KINDS.map(([kk,lbl])=>`<div class="segi ${kk===kind?'active':''}" data-vk="${k}" data-kind="${kk}">${lbl}</div>`).join('')+`</div>`;
    // detail
    h+=`<div class="detail">`;
    if(vr){
      h+=`<div class="exhead"><div class="exvarname">${vr.name}</div></div>`;
      if(cue)h+=`<div class="cue">${cue}</div>`;
      h+=`<div class="imgs"><div class="imgcell"><span class="tag">Start</span><img loading="lazy" src="${vr.img}"></div>
        <div class="imgcell"><span class="tag">Finish</span><img loading="lazy" src="${vr.img2}"></div></div>`;
    }
    if(force)h+=`<div class="force-note ${st.force?'show':''}"><b>💪 Strength:</b> ${force} — heavier, fewer reps, longer rest.</div>`;
    h+=`<div class="sets">`;
    st.sets.forEach((set,j)=>{
      h+=`<div class="setrow"><div class="sl">SET ${j+1}</div>
        <input inputmode="decimal" placeholder="kg" value="${set.w}" class="${set.w?'filled':''}" data-sk="${k}" data-si="${j}" data-f="w">
        <span class="x">×</span>
        <input inputmode="numeric" placeholder="reps" value="${set.r}" class="${set.r?'filled':''}" data-sk="${k}" data-si="${j}" data-f="r">
        <div class="last">${set.last?set.last:''}</div></div>`;
    });
    h+=`</div><button class="addset" data-add="${k}">+ Add set</button></div>`;
    card.innerHTML=h;w.appendChild(card);
  });

  w.querySelectorAll('[data-chk]').forEach(e=>e.onclick=()=>{live[e.dataset.chk].done=!live[e.dataset.chk].done;if(navigator.vibrate)navigator.vibrate(8);render();});
  w.querySelectorAll('[data-force]').forEach(e=>e.onclick=()=>{const k=e.dataset.force;live[k].force=!live[k].force;render();});
  w.querySelectorAll('[data-vk]').forEach(e=>e.onclick=()=>{const k=e.dataset.vk,kind=e.dataset.kind,slot=k.split("|")[1];live[k].kind=kind;live[k].sets=null;pref[slot]=kind;savePref();render();});
  w.querySelectorAll('input[data-sk]').forEach(e=>e.oninput=()=>{const k=e.dataset.sk,i=+e.dataset.si,f=e.dataset.f;live[k].sets[i][f]=e.value;e.classList.toggle('filled',!!e.value);const rs=$('.ring');});
  w.querySelectorAll('[data-add]').forEach(e=>e.onclick=()=>{live[e.dataset.add].sets.push({w:"",r:"",last:""});render();});
}

function finishWorkout(){
  const s=DATA.sessions[cur],slots=[];
  s.slots.forEach(sl=>{
    const slot=sl[0],k=keyOf(slot),st=live[k];if(!st)return;
    const sets=(st.sets||[]).filter(x=>x.w!==""||x.r!=="").map(x=>({w:x.w,r:x.r}));
    if(sets.length||st.done)slots.push({slot,kind:st.kind,done:st.done,force:!!st.force,sets});
  });
  if(!slots.length){toast("Log something first 💪");return;}
  const l=log();
  l.push({id:Date.now(),date:new Date().toISOString(),sess:cur,name:s.name,slots});
  saveLog(l);
  s.slots.forEach(sl=>delete live[keyOf(sl[0])]);
  toast("Session "+cur+" saved!",ico.save);
  if(navigator.vibrate)navigator.vibrate([10,40,10]);
  render();
  if(gh&&gh.token)pushSync();
}

/* ---------- History ---------- */
function showHistory(){
  const l=log().slice().reverse();
  const hues={A:'var(--push)',B:'var(--pull)',C:'var(--full)'};
  let h=`<div class="grab"></div><h2>History</h2><div class="sh-sub">${l.length} session${l.length!==1?'s':''} logged</div>`;
  if(!l.length)h+=`<div class="empty">${ico.empty}<br>No sessions yet.<br>Finish a workout and it lands here — with last week's numbers to beat.</div>`;
  l.slice(0,60).forEach(e=>{
    const d=new Date(e.date);
    const ds=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
    const ts=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    h+=`<div class="hentry"><div class="hd"><span class="hbadge" style="color:${hues[e.sess]||'var(--ink)'}">${DATA.sessions[e.sess]?DATA.sessions[e.sess].emoji:''} ${e.name}</span><span class="htime">${ds} · ${ts}</span></div><div class="hln">`;
    h+=(e.slots||[]).map(s=>{
      const sets=(s.sets||[]).map(x=>`${x.w||'–'}×${x.r||'–'}`).join('  ');
      return `<b>${s.slot}</b> <span style="color:var(--mut)">${s.kind}${s.force?' · 💪':''}</span> ${sets||'✓'}`;
    }).join('<br>');
    h+=`</div></div>`;
  });
  if(l.length)h+=`<button class="btn sec" onclick="exportData()" style="margin-top:8px">⬇︎ Export backup (JSON)</button>`;
  h+=`<button class="btn acc" onclick="hideModal()" style="margin-top:8px">Close</button>`;
  openSheet(h);
}

/* ---------- Settings / Sync ---------- */
function showSettings(){
  const stMap={off:['off','Not connected — data stays on this device'],ok:['ok','Synced with GitHub'],sync:['sync','Syncing…'],err:['err','Sync error — check token']};
  const [sd,stxt]=stMap[syncState]||stMap.off;
  let h=`<div class="grab"></div><h2>Settings</h2><div class="sh-sub">Cross-device sync via your private GitHub repo</div>`;
  h+=`<div class="sync-status"><span class="sd ${sd}"></span><span>${stxt}</span></div>`;
  h+=`<div class="field"><label>GitHub repo (owner/name)</label>
    <input id="gh-repo" placeholder="omarjesusperezortiz/gym-data" value="${gh&&gh.repo?gh.repo:'omarjesusperezortiz/gym-data'}"></div>`;
  h+=`<div class="field"><label>Fine-grained token</label>
    <input id="gh-token" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="github_pat_..." value="${gh&&gh.token?gh.token:''}">
    <div class="hint">Scoped to just this one repo (Contents: Read+Write). Stored only on this device, never in the app code. I'll give you the 90-sec steps.</div></div>`;
  h+=`<button class="btn acc" onclick="saveGh()">Save & Sync now</button>`;
  h+=`<button class="btn sec" onclick="pullSync(true)" style="margin-top:8px">⬇︎ Pull from GitHub</button>`;
  if(gh&&gh.token)h+=`<button class="btn sec" onclick="disconnectGh()" style="margin-top:8px;color:var(--danger)">Disconnect</button>`;
  h+=`<button class="btn sec" onclick="hideModal()" style="margin-top:8px">Close</button>`;
  openSheet(h);
}
function saveGh(){
  const repo=$("#gh-repo").value.replace(/\s+/g,''), token=$("#gh-token").value.replace(/\s+/g,'');
  if(!repo||!token){toast("Fill both fields");return;}
  gh={repo,token};localStorage.setItem(LS_GH,JSON.stringify(gh));
  toast("Saved — syncing…");mergeSync();
}
function disconnectGh(){gh=null;localStorage.removeItem(LS_GH);syncState="off";toast("Disconnected");showSettings();}

async function ghGet(){
  const r=await fetch(`https://api.github.com/repos/${gh.repo}/contents/workouts.json`,{
    headers:{Authorization:`Bearer ${gh.token}`,Accept:"application/vnd.github+json"}});
  if(r.status===404)return {data:{sessions:[]},sha:null};
  if(!r.ok)throw new Error("GET "+r.status+(r.status===401?" (bad/expired token)":r.status===403?" (token lacks Contents R/W)":r.status===404?" (repo not found — check owner/name)":""));
  const j=await r.json();
  const content=JSON.parse(decodeURIComponent(escape(atob(j.content))));
  return {data:content,sha:j.sha};
}
async function ghPut(data,sha){
  const body={message:"workout sync "+new Date().toISOString(),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))};
  if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${gh.repo}/contents/workouts.json`,{
    method:"PUT",headers:{Authorization:`Bearer ${gh.token}`,Accept:"application/vnd.github+json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("PUT "+r.status);
  return r.json();
}
function mergeLogs(remote,local){
  const map={};
  [...(remote||[]),...(local||[])].forEach(s=>{if(s&&s.id!=null)map[s.id]=s; else if(s){map[s.date]=s;}});
  return Object.values(map).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
async function mergeSync(){
  if(!gh||!gh.token){syncState="off";return;}
  syncState="sync";refreshSyncUI();
  try{
    const {data,sha}=await ghGet();
    const merged=mergeLogs(data.sessions,log());
    saveLog(merged);
    await ghPut({version:2,updatedAt:new Date().toISOString(),device:navigator.platform,sessions:merged},sha);
    syncState="ok";toast("Synced ✓",ico.save);
  }catch(e){syncState="err";toast("Sync failed: "+e.message);}
  refreshSyncUI();render();
}
async function pushSync(){
  if(!gh||!gh.token)return;
  syncState="sync";refreshSyncUI();
  try{const {sha}=await ghGet();
    await ghPut({version:2,updatedAt:new Date().toISOString(),device:navigator.platform,sessions:log()},sha);
    syncState="ok";}catch(e){syncState="err";toast("Sync failed: "+e.message);}
  refreshSyncUI();
}
async function pullSync(manual){
  if(!gh||!gh.token){if(manual)toast("Connect GitHub first");return;}
  syncState="sync";refreshSyncUI();
  try{const {data}=await ghGet();
    const merged=mergeLogs(data.sessions,log());saveLog(merged);
    syncState="ok";if(manual){toast("Pulled ✓",ico.save);showSettings();}render();
  }catch(e){syncState="err";if(manual)toast("Pull failed: "+e.message);}
  refreshSyncUI();
}
function refreshSyncUI(){
  const dot=$("#sync-dot");if(dot)dot.className="dot "+(syncState==='ok'?'':'');
  const badge=$("#hdr-sync");if(badge){badge.style.display=(syncState==='err')?'block':'none';}
}

function exportData(){
  const blob=new Blob([JSON.stringify({log:log(),pref},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gym-tracker-backup.json';a.click();
}

function openSheet(h){$("#sheet").innerHTML=h;$("#modal").classList.add('show');}
function hideModal(){$("#modal").classList.remove('show');}
$("#modal").onclick=e=>{if(e.target.id==='modal')hideModal();};

// init
render();
if(gh&&gh.token){syncState="ok";pullSync(false);}
</script>
</body>
